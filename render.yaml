services:
  - type: web
    name: partner-desk
    runtime: node
    plan: free
    repo: https://github.com/Georgefifth/partner-desk
    branch: codex/product-review
    buildCommand: npm test
    startCommand: node server.mjs
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_DAILY_LIMIT
        value: '100'
      - key: ACCESS_TOKEN
        generateValue: true
      - key: QLOO_API_KEY
        sync: false
